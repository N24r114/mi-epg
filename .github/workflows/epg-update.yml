name: Auto Generate EPG (iptv-org)

on:
  schedule:
    - cron: '0 3 * * *'  # Diariamente a las 3 AM UTC (ajusta si quieres)
  workflow_dispatch:  # Permite ejecución manual

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Para push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.MY_GITHUB_TOKEN }}  # Tu token para push
        fetch-depth: 0

    - name: Clone iptv-org/epg (como en README)
      run: |
        git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-grabber

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'  # Versión recomendada
        cache: 'npm'
        cache-dependency-path: epg-grabber/package-lock.json

    - name: Install dependencies (npm install como en README)
      run: |
        cd epg-grabber
        npm install

    - name: Copy custom channel list (GIANUEVA.xml)
      run: |
        if [ -f GIANUEVA.xml ]; then
          cp GIANUEVA.xml epg-grabber/
          echo "Canales cargados: $(grep -c '<channel' GIANUEVA.xml)"
        else
          echo "ERROR: GIANUEVA.xml no encontrado"
          exit 1
        fi

    - name: Generate EPG (npm run grab como en README)
      run: |
        cd epg-grabber
        npm run grab -- \
          --channels="GIANUEVA.xml" \  # Tu lista personalizada
          --days=2 \  # 2 días (ajusta si quieres más)
          --delay=3000 \  # Delay para evitar bloqueos
          --maxConnections=1 \  # 1 conexión para estabilidad
          --timeout=20000 \  # Timeout 20s
          --gzip \  # Genera .gz como en opciones
          --output=guide.xml
        echo "EPG generado: $(wc -c < guide.xml) bytes"

    - name: Fallback si guide.xml está vacío
      run: |
        if [ ! -s guide.xml ]; then
          echo "Fallback: EPG vacío"
          echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?><tv generator-info-name=\"mi-epg\"></tv>" > guide.xml
        fi

    - name: Copy generated files
      run: |
        cp epg-grabber/guide.xml ./
        cp epg-grabber/guide.xml.gz ./ 2>/dev/null || true

    - name: Update README y last-update
      run: |
        echo "Última actualización: $(date '+%Y-%m-%d %H:%M:%S')" > last-update.txt
        cat > README.md << EOF
        # Mi EPG Personal

        **EPG peruano de Movistar TV - Generado con iptv-org/epg**

        **Última actualización:** $(date '+%Y-%m-%d %H:%M:%S')  
        **Canales:** $(grep -c '<channel' GIANUEVA.xml) (de tu GIANUEVA.xml)

        ### Enlaces
        - **XML:** https://raw.githubusercontent.com/${{ github.repository }}/main/guide.xml
        - **GZIP:** https://raw.githubusercontent.com/${{ github.repository }}/main/guide.xml.gz

        **Generado automáticamente cada día.**
        EOF

    - name: Commit and push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        if git diff --staged --quiet; then
          echo "No hay cambios para commit"
        else
          git commit -m "Auto-update EPG - $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
        fi
