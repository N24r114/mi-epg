name: Auto Generate EPG (iptv-org)

on:
  schedule:
    - cron: '0 3 * * *'  # Diariamente a las 3 AM UTC
  workflow_dispatch:  # Manual

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.MY_GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Clone iptv-org/epg (como en README)
      run: |
        git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-grabber

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: epg-grabber/package-lock.json

    - name: Install dependencies (npm install como en README)
      run: |
        cd epg-grabber
        npm install

    - name: Copy custom channel list (GIANUEVA.xml)
      run: |
        if [ -f GIANUEVA.xml ]; then
          cp GIANUEVA.xml epg-grabber/
          echo "Canales cargados: $(grep -c '<channel' GIANUEVA.xml)"
        else
          echo "ERROR: GIANUEVA.xml no encontrado"
          exit 1
        fi

    - name: Generate EPG (npm run grab corregido)
      run: |
        cd epg-grabber
        # Comando corregido: sin comillas, ruta relativa
        npm run grab -- --channels=./GIANUEVA.xml --days=2 --delay=3000 --maxConnections=1 --timeout=20000 --gzip --output=guide.xml
        echo "EPG generado: $(wc -c < guide.xml) bytes"

    - name: Fallback si guide.xml está vacío o sin programas
      run: |
        if [ ! -s guide.xml ] || [ $(grep -c '<programme' guide.xml) -eq 0 ]; then
          echo "Fallback: Descargando EPG peruano alternativo"
          curl -f -L -o guide.xml "https://epg.pw/xmltv/peru.xml" || \
          echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?><tv generator-info-name=\"mi-epg\"></tv>" > guide.xml
          gzip -9 guide.xml 2>/dev/null || true
        else
          gzip -9 guide.xml 2>/dev/null || true
        fi
        echo "Final: $(wc -c < guide.xml) bytes, programas: $(grep -c '<programme' guide.xml)"

    - name: Copy generated files
      run: |
        cp epg-grabber/guide.xml ./
        [ -f epg-grabber/guide.xml.gz ] && cp epg-grabber/guide.xml.gz ./ || true

    - name: Update README y last-update
      run: |
        echo "Última actualización: $(date '+%Y-%m-%d %H:%M:%S')" > last-update.txt
        cat > README.md << EOF
        # Mi EPG Personal

        **EPG peruano de Movistar TV - Generado con iptv-org/epg**

        **Última actualización:** $(date '+%Y-%m-%d %H:%M:%S')  
        **Canales:** $(grep -c '<channel' GIANUEVA.xml)  
        **Programas:** $(grep -c '<programme' guide.xml)

        ### Enlaces
        - **XML:** https://raw.githubusercontent.com/${{ github.repository }}/main/guide.xml
        - **GZIP:** https://raw.githubusercontent.com/${{ github.repository }}/main/guide.xml.gz

        **Generado automáticamente cada día.**
        EOF

    - name: Commit and push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        if git diff --staged --quiet; then
          echo "No hay cambios para commit"
        else
          git commit -m "Auto-update EPG - $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
        fi
