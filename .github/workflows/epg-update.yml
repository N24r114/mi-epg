name: Auto Generate EPG

on:
  schedule:
    - cron: '0 3 * * *'  # Diariamente a las 3 AM (tu horario original)
  workflow_dispatch:     # Permite ejecutar manualmente

jobs:
  generate-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Clone iptv-org/epg
      run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-grabber

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: epg-grabber/package-lock.json

    - name: Install dependencies
      run: |
        cd epg-grabber
        npm ci

    - name: Copy GIANUEVA.xml
      run: |
        if [ -f GIANUEVA.xml ]; then
          cp GIANUEVA.xml epg-grabber/
          echo "GIANUEVA.xml copiado (canales: $(grep '<channel' GIANUEVA.xml | wc -l))"
        else
          echo "ERROR: GIANUEVA.xml no encontrado en el repositorio"
          exit 1
        fi

    - name: Generate EPG
      run: |
        cd epg-grabber
        echo "Iniciando grabber con --days=2, --delay=3000, --maxConnections=1..."
        npm run grab -- \
          --channels="GIANUEVA.xml" \
          --days=2 \
          --delay=3000 \
          --maxConnections=1 \
          --timeout=20000 \
          --output=guide.xml \
          || echo "Grabber terminó con errores (continuamos con fallback)"

    - name: Debug - Verificar guide.xml
      run: |
        echo "=== CONTENIDO DE epg-grabber/ ==="
        ls -la epg-grabber/ | head -15
        if [ -f epg-grabber/guide.xml ]; then
          echo "guide.xml existe → $(wc -c < epg-grabber/guide.xml) bytes"
        else
          echo "guide.xml NO se generó"
        fi

    - name: Copy generated files
      run: |
        # Si existe y tiene contenido
        if [ -f epg-grabber/guide.xml ] && [ -s epg-grabber/guide.xml ]; then
          cp epg-grabber/guide.xml ./
          echo "guide.xml copiado correctamente"
        else
          echo "ADVERTENCIA: guide.xml vacío o no generado → usando fallback"
          echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?><tv generator-info-name=\"mi-epg\"></tv>" > guide.xml
        fi

        # Copiar .gz solo si existe
        if [ -f epg-grabber/guide.xml.gz ]; then
          cp epg-grabber/guide.xml.gz ./
          echo "guide.xml.gz copiado"
        else
          echo "No hay guide.xml.gz"
        fi

    - name: Update info
      run: |
        echo "Última actualización: $(date '+%Y-%m-%d %H:%M:%S')" > last-update.txt
        
        cat > README.md << 'EOF'
        # Mi EPG Personal

        **EPG generado automáticamente con tus canales favoritos.**

        ---
        ### Enlaces
        - **XML:** https://raw.githubusercontent.com/${{ github.repository }}/main/guide.xml
        - **GZIP:** https://raw.githubusercontent.com/${{ github.repository }}/main/guide.xml.gz
        - **Última actualización:** $(date '+%Y-%m-%d %H:%M:%S')

        ---
        > Generado con [iptv-org/epg](https://github.com/iptv-org/epg)  
        > Canales: $(grep '<channel' GIANUEVA.xml | wc -l)
        EOF

    - name: Configure git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit and push
      run: |
        git add .
        if git diff --staged --quiet; then
          echo "No hay cambios para commitear"
        else
          git commit -m "Auto-update EPG - $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
        fi
